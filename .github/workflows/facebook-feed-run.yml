name: Facebook feed engine (isolated)
on:
  workflow_call:
    outputs:
      state_restored:
        value: ${{ jobs.feed.outputs.state_restored }}
      watchdog_alert:
        value: ${{ jobs.feed.outputs.watchdog_alert }}
      watchdog_report:
        value: ${{ jobs.feed.outputs.watchdog_report }}
    inputs:
      diagnostic:
        default: false
        type: boolean
      invocation:
        default: main
        type: string
      kind:
        required: true
        type: string
      publish:
        default: false
        type: boolean
      preview:
        default: false
        type: boolean
      bootstrap:
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      diagnostic:
        description: Read-only API diagnostics (never publishes)
        default: false
        type: boolean
      kind:
        type: choice
        options: [community, card, weekly, live, roundup, results, preflight, editorial]
        default: community
      publish:
        description: Request publishing (config + repository variable must also allow it)
        type: boolean
        default: false
      preview:
        description: Preview outside scheduled slot (never bypasses publishing safety gates)
        type: boolean
        default: true
      bootstrap:
        description: Initialize missing live ledger ONLY after inspecting the Page for prior attempts
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
# Independent of goals-scan: feed failures cannot hold the Reel/scanner mutex or overwrite its data.
concurrency:
  group: facebook-feed-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  feed:
    runs-on: ubuntu-latest
    outputs:
      state_restored: ${{ steps.assess.outputs.restored || steps.prepare.outputs.restored }}
      # A failed/missing final checkpoint needs an alert even if the earlier audit was healthy.
      watchdog_alert: ${{ steps.final.conclusion != 'success' || steps.health.outputs.alert_fallback }}
      watchdog_report: ${{ steps.health.outputs.health_report }}
    timeout-minutes: 10
    env:
      CONTENT_KIND: ${{ inputs.kind }}
      REQUEST_PUBLISH: ${{ inputs.publish }}
      REQUEST_PREVIEW: ${{ inputs.preview }}
      REQUEST_BOOTSTRAP: ${{ inputs.bootstrap }}
      FACEBOOK_FEED_PUBLISH: ${{ vars.FACEBOOK_FEED_PUBLISH || 'false' }}
    steps:
      - name: Check out feed code
        uses: actions/checkout@v4.4.0
      - name: Read scanner publication without modifying its state
        if: inputs.kind != 'live' && inputs.kind != 'editorial'
        uses: actions/checkout@v4.4.0
        with:
          ref: data
          path: tmp/feed-source
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            data/app/latest.json
            data/app/fx/
            data/app/days/
            data/advisor_ledger.json
            data/app/telegram_state.json
      - name: Read published Bet Advisor for the morning predictions (never provider data)
        if: inputs.kind == 'editorial'
        uses: actions/checkout@v4.4.0
        with:
          ref: data
          path: tmp/feed-source
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            data/app/latest.json
      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: Install existing locked graphics dependency only when needed
        if: ${{ !inputs.diagnostic && (inputs.kind == 'card' || inputs.kind == 'weekly' || inputs.kind == 'live' || inputs.kind == 'editorial') }}
        run: |
          pip install --require-hashes --only-binary=:all: --no-deps -q -r requirements-feed.txt
      - name: Read-only API/key diagnostic (no Facebook credentials or requests)
        id: diagnostic
        if: inputs.diagnostic
        env:
          GH_READ_TOKEN: ${{ github.token }}
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_KEY_1: ${{ secrets.API_FOOTBALL_KEY_1 }}
          API_FOOTBALL_KEY_2: ${{ secrets.API_FOOTBALL_KEY_2 }}
        run: python -m facebook_feed.diagnostics
      - name: Assess editorial delivery and allocate a bounded attempt
        id: assess
        if: ${{ !inputs.diagnostic && inputs.kind == 'editorial' && inputs.publish && github.ref_name == 'main' }}
        env:
          WATCHDOG_REQUEST_PUBLISH: 'true'
          GH_READ_TOKEN: ${{ github.token }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: python -m facebook_feed.watchdog assess
      - name: Save editorial admission BEFORE provider preparation
        id: admission
        if: steps.assess.outputs.allow_prepare == 'true'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ steps.assess.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.invocation || 'main' }}-admitted
          path: tmp/facebook-feed/checkpoint/state.json
          retention-days: 30
          if-no-files-found: error
      - name: Restore independent ledger and prepare verified content
        if: ${{ !inputs.diagnostic && (inputs.kind != 'editorial' || !inputs.publish || github.ref_name != 'main' || (steps.assess.outputs.allow_prepare == 'true' && steps.admission.conclusion == 'success')) }}
        id: prepare
        env:
          GH_READ_TOKEN: ${{ github.token }}
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_KEY_1: ${{ secrets.API_FOOTBALL_KEY_1 }}
          API_FOOTBALL_KEY_2: ${{ secrets.API_FOOTBALL_KEY_2 }}
          # Only used for read-only acknowledgement reconciliation when publish gates allow it.
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          args=()
          [[ "$REQUEST_PUBLISH" != "true" ]] || args+=(--publish)
          [[ "$REQUEST_PREVIEW" != "true" ]] || args+=(--preview)
          [[ "$REQUEST_BOOTSTRAP" != "true" ]] || args+=(--bootstrap)
          [[ "${{ steps.admission.conclusion }}" != "success" ]] || args+=(--watchdog-checkpoint)
          python -m facebook_feed.cli prepare --kind "$CONTENT_KIND" "${args[@]}"
      - name: Save durable reservation BEFORE any Facebook mutation
        id: reserve
        if: steps.prepare.outputs.should_publish == 'true'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ steps.prepare.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.invocation || 'main' }}-reserved
          path: tmp/facebook-feed/checkpoint/state.json
          retention-days: 30
          if-no-files-found: error
      - name: Stage two unpublished package photos after reservation
        id: stage_media
        if: steps.prepare.outputs.needs_media_staging == 'true' && steps.reserve.conclusion == 'success'
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: python -m facebook_feed.cli stage --kind editorial --publish --checkpoint
      - name: Save both media IDs BEFORE creating the single feed post
        id: media_checkpoint
        if: steps.stage_media.outputs.should_finalize == 'true'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ steps.prepare.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.invocation || 'main' }}-media-staged
          path: tmp/facebook-feed/checkpoint/state.json
          retention-days: 30
          if-no-files-found: error
      - name: Publish or edit only after reservation checkpoint succeeded
        id: send
        if: steps.prepare.outputs.should_publish == 'true' && steps.reserve.conclusion == 'success' && (steps.prepare.outputs.needs_media_staging != 'true' || steps.media_checkpoint.conclusion == 'success')
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          args=()
          [[ "${{ steps.media_checkpoint.conclusion }}" != "success" ]] || args+=(--media-checkpoint)
          python -m facebook_feed.cli send --kind "$CONTENT_KIND" --publish --checkpoint "${args[@]}"
      - name: Audit real delivery and alert on intervention-required failures
        id: health
        if: ${{ always() && !inputs.diagnostic && inputs.kind == 'editorial' && inputs.publish && github.ref_name == 'main' }}
        env:
          WATCHDOG_REQUEST_PUBLISH: 'true'
          WATCHDOG_PIPELINE_OK: ${{ steps.assess.conclusion == 'success' && steps.admission.conclusion != 'failure' && steps.admission.conclusion != 'cancelled' && steps.prepare.conclusion != 'failure' && steps.prepare.conclusion != 'cancelled' && steps.reserve.conclusion != 'failure' && steps.reserve.conclusion != 'cancelled' && steps.stage_media.conclusion != 'failure' && steps.media_checkpoint.conclusion != 'failure' && steps.send.conclusion != 'failure' && steps.send.conclusion != 'cancelled' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m facebook_feed.watchdog audit
      - name: Save final ledger including ambiguous failures
        id: final
        if: always() && (steps.assess.conclusion == 'success' || steps.prepare.conclusion == 'success' || steps.diagnostic.conclusion == 'success')
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ steps.assess.outputs.prefix || steps.prepare.outputs.prefix || steps.diagnostic.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.invocation || 'main' }}-final
          path: tmp/facebook-feed/checkpoint/state.json
          retention-days: 30
          if-no-files-found: error
      - name: Save public captions, graphics and safe planning report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: facebook-feed-preview-${{ inputs.kind }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.invocation || 'main' }}
          path: |
            tmp/facebook-feed/*.jpg
            tmp/facebook-feed/*.txt
            tmp/facebook-feed/report.json
            tmp/facebook-feed/watchdog-report.json
            tmp/facebook-feed/api-diagnostic.json
            tmp/facebook-feed/live-watchlist.json
          retention-days: 7
          if-no-files-found: ignore
