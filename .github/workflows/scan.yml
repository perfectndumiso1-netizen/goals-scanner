name: PlayReport scan (every 30 min)

on:
  schedule:
    # GitHub cron is UTC. A run every half hour; the ones nearest 05:00 / 10:00 / 15:00 UTC
    # (07:00 / 12:00 / 17:00 SAST) are the full-report runs, the others refresh prices / results and alert new bets.
    - cron: "*/30 * * * *"
  workflow_dispatch:        # run it manually from the Actions tab at any time

permissions:
  contents: write           # push the state branch

concurrency:
  group: goals-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      TIMEZONE: "Africa/Johannesburg"   # timezone for all displayed times and the scan window
      TZ_LABEL: "SAST"
      RUN_HOURS: "7,12,17"  # full-report hours (local); the other half-hourly runs are refreshes
      WINDOW_HOURS: "24"    # scan matches kicking off within the next 24 hours
      MIN_P_O15: "0.84"     # shortlist thresholds (final probability)
      MIN_P_O25: "0.60"
      MIN_P_BTTS: "0.60"
      MAX_PICKS: "15"
      SPORTY_CC: "za"       # Sportybet country site used for prices (za, ng, gh, ke, ug, tz, zm)
      WORLD: "1"            # every competition on Livescore.com (v4)
      STATE_DIR: ${{ github.workspace }}/state
      STATE_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}   # optional
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}       # optional
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore state (data branch)
        run: |
          set -e
          if git clone -q --depth 1 --branch data --single-branch "$STATE_URL" state 2>/dev/null; then
            echo "state branch restored: $(du -sh state | cut -f1)"
          else
            echo "no state branch yet - bootstrapping from the code branch"
            mkdir -p state
            cp -r data state/ 2>/dev/null || true
            cp -r reports state/ 2>/dev/null || true
            rm -rf state/reports/pdf
            git -C state init -q -b data
          fi
          printf 'reports/pdf/\n__pycache__/\n' > state/.gitignore

      - name: Run scanner
        run: python scanner.py

      - name: Publish state
        run: |
          set -e
          cd state
          git config user.name "playreport-bot"
          git config user.email "playreport-bot@users.noreply.github.com"
          git add -A
          if git rev-parse -q --verify HEAD >/dev/null 2>&1; then
            if git diff --cached --quiet; then echo "state unchanged"; exit 0; fi
            git commit -q --amend -m "State $(date -u +'%Y-%m-%d %H:%M UTC')"
          else
            git commit -q -m "State $(date -u +'%Y-%m-%d %H:%M UTC')"
          fi
          git push -q -f "$STATE_URL" HEAD:data
          echo "published $(git rev-parse --short HEAD)"
