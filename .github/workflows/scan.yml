name: PlayReport scan (every 30 min)

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "!tests/**"
      - "!android/**"
      - "requirements*"
      - "config/**"
      - "*.json"
      - "*.yaml"
      - "*.yml"
      - ".github/workflows/scan.yml"
  schedule:
    # GitHub cron is UTC. A run every half hour; the ones nearest 05:00 / 10:00 / 15:00 UTC
    # (07:00 / 12:00 / 17:00 SAST) are the full-report runs, the others refresh prices / results and alert new bets.
    - cron: "*/30 * * * *"
  workflow_dispatch:        # run it manually from the Actions tab at any time

permissions:
  contents: write           # push the state branch

concurrency:
  group: goals-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # the 60-day coverage window analyses ~17k fixtures per run
    env:
      TIMEZONE: "Africa/Johannesburg"   # timezone for all displayed times and the scan window
      TZ_LABEL: "SAST"
      RUN_HOURS: "7,12,17"  # full-report hours (local); the other half-hourly runs are refreshes
      COVER_DAYS: "60"      # discover + analyse fixtures up to 60 days out (early data collection)
      APP_WINDOW_HOURS: "24"  # the app publication still carries today's matches only
      NEWS_HOURS: "72"      # per-fixture news fetches only within 72 h of kick-off
      MIN_P_O15: "0.84"     # shortlist thresholds (final probability)
      MIN_P_O25: "0.60"
      MIN_P_BTTS: "0.60"
      MAX_PICKS: "15"
      SPORTY_CC: "za"       # Sportybet country site used for prices (za, ng, gh, ke, ug, tz, zm)
      WORLD: "1"            # every competition on Livescore.com (v4)
      STATE_DIR: ${{ github.workspace }}/state
      STATE_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}   # optional
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}       # optional
    steps:
      - name: Check out code
        uses: actions/checkout@v4.4.0

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Determine whether this scan can send the morning reel
        id: reel_window
        shell: bash
        run: |
          local_hour="$(TZ=Africa/Johannesburg date +%H)"
          local_minute="$(TZ=Africa/Johannesburg date +%M)"
          local_minutes=$((10#$local_hour * 60 + 10#$local_minute))
          if (( local_minutes >= 300 && local_minutes < 440 )); then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Piper Amy voice
        if: steps.reel_window.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/playreport-piper
          key: ${{ runner.os }}-piper-en-us-amy-medium-v1.0.0

      - name: Install dependencies
        # wheels only + retries: a PyPI hiccup once made pip fall back to building pandas from source and the run failed
        # ffmpeg + Piper neural voice (with eSpeak local fallback): daily 9:16 reel; no bed music.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          for i in 1 2 3; do
            pip install --require-hashes --only-binary=:all: --retries 10 --timeout 60 -r requirements.txt && break
            echo "pip attempt $i failed, retrying"; sleep 20
          done
          python -c "import pandas, numpy, requests, reportlab, PIL; print(pandas.__version__, numpy.__version__)"

      - name: Prepare neural narration voice
        # Piper is isolated from the scanner's pinned Python dependencies; the voice is cached and checksum-verified.
        if: steps.reel_window.outputs.enabled == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/piper-venv"
          "$RUNNER_TEMP/piper-venv/bin/pip" install --disable-pip-version-check --only-binary=:all: --retries 10 --timeout 60 "piper-tts==1.8.0"
          VOICE_DIR="$HOME/.cache/playreport-piper"
          mkdir -p "$VOICE_DIR"
          MODEL="$VOICE_DIR/en_US-amy-medium.onnx"
          CONFIG="$MODEL.json"
          fetch_checked() {
            local url="$1" path="$2" expected="$3" tmp="$2.tmp"
            if [[ -s "$path" ]] && printf '%s  %s\n' "$expected" "$path" | sha256sum --check --status; then
              echo "Verified cached voice file: $(basename "$path")"
              return
            fi
            rm -f "$tmp"
            curl --fail --location --retry 3 --retry-all-errors "$url" --output "$tmp"
            printf '%s  %s\n' "$expected" "$tmp" | sha256sum --check
            mv "$tmp" "$path"
          }
          fetch_checked \
            "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_US/amy/medium/en_US-amy-medium.onnx" \
            "$MODEL" "b3a6e47b57b8c7fbe6a0ce2518161a50f59a9cdd8a50835c02cb02bdd6206c18"
          fetch_checked \
            "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_US/amy/medium/en_US-amy-medium.onnx.json" \
            "$CONFIG" "95a23eb4d42909d38df73bb9ac7f45f597dbfcde2d1bf9526fdeaf5466977d77"
          "$RUNNER_TEMP/piper-venv/bin/python" -m piper -m "$MODEL" -c "$CONFIG" \
            -f "$RUNNER_TEMP/piper-smoke.wav" -- "Good morning. PlayReport shortlist is ready."
          test -s "$RUNNER_TEMP/piper-smoke.wav"
          echo "PIPER_PYTHON=$RUNNER_TEMP/piper-venv/bin/python" >> "$GITHUB_ENV"
          echo "PIPER_MODEL_PATH=$MODEL" >> "$GITHUB_ENV"
          echo "PIPER_CONFIG_PATH=$CONFIG" >> "$GITHUB_ENV"

      - name: Restore state (data branch)
        run: |
          set -e
          if git clone -q --depth 1 --branch data --single-branch "$STATE_URL" state 2>/dev/null; then
            echo "state branch restored: $(du -sh state | cut -f1)"
          else
            echo "no state branch yet - bootstrapping from the code branch"
            mkdir -p state
            cp -r data state/ 2>/dev/null || true
            cp -r reports state/ 2>/dev/null || true
            rm -rf state/reports/pdf
            git -C state init -q -b data
          fi
          printf 'reports/pdf/\n__pycache__/\n' > state/.gitignore

      - name: Run scanner
        run: python scanner.py

      - name: Publish state
        run: |
          set -e
          cd state
          git config user.name "playreport-bot"
          git config user.email "playreport-bot@users.noreply.github.com"
          git add -A
          if git rev-parse -q --verify HEAD >/dev/null 2>&1; then
            if git diff --cached --quiet; then echo "state unchanged"; exit 0; fi
            git commit -q --amend -m "State $(date -u +'%Y-%m-%d %H:%M UTC')"
          else
            git commit -q -m "State $(date -u +'%Y-%m-%d %H:%M UTC')"
          fi
          git push -q -f "$STATE_URL" HEAD:data
          echo "published $(git rev-parse --short HEAD)"

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@v4.4.0

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Unit tests (leagues + world archive)
        # the test lock includes the pinned runtime set plus pytest
        run: |
          pip install --require-hashes --only-binary=:all: --retries 10 --timeout 60 -q -r requirements-test.txt
          python -m pytest leagues/tests tests -q
