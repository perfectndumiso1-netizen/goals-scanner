name: Facebook feed upgrade dry-run validation
on:
  workflow_dispatch:
  push:
    branches: [arena/89e9b4bf-goals-scanner]
    paths: [config/facebook-feed-dry-run.json]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tested code
        uses: actions/checkout@v4.4.0
      - name: Read actual published fixture evidence
        uses: actions/checkout@v4.4.0
        with:
          ref: data
          path: tmp/feed-source
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            data/app/latest.json
            data/app/fx/
            data/app/days/
            data/advisor_ledger.json
      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: Install existing locked test dependencies
        run: |
          pip install --require-hashes --only-binary=:all: -q -r requirements-test.txt
      - name: Regression tests including unchanged Reel invariants
        run: python -m pytest leagues/tests tests tennis/tests -q --junitxml=tmp/facebook-feed/test-results.xml
      - name: Generate every new content type without Facebook credentials or mutation calls
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m facebook_feed.cli preview --kind all --source tmp/feed-source/data/app
      - name: Keep real captions, original graphics and skip reasons for review
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: facebook-upgrade-dry-run-${{ github.run_id }}
          path: tmp/facebook-feed/
          retention-days: 7
          if-no-files-found: ignore
