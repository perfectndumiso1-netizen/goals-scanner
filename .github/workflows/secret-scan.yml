name: Secret scan

# Credential guard: fails if a token, key or password pattern reaches a tracked file on main.
# Standalone by design — it reads files only, sends nothing, keeps no state, and does not
# touch the football / tennis pipelines. Run the same check locally:
#     python3 scripts/check_secrets.py
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tracked files for credentials
        run: python3 scripts/check_secrets.py
