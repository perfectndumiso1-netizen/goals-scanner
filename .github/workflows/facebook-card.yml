name: Facebook Interesting Stats Match Card
on:
  schedule:
    - cron: "15 16 * * 2,4,6"
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
      preview:
        type: boolean
        default: true
      bootstrap:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  content:
    uses: ./.github/workflows/facebook-feed-run.yml
    with:
      kind: card
      publish: ${{ github.event_name == 'schedule' || inputs.publish }}
      preview: ${{ github.event_name == 'workflow_dispatch' && inputs.preview }}
      bootstrap: ${{ inputs.bootstrap || false }}
    secrets: inherit
