name: Facebook scheduled posts (nine matches + 1X2)
on:
  schedule:
    # Owner replaced the combined fixtures bulletin with published Advisor 1X2 predictions.
    - cron: "30 5 * * *"
    - cron: "50 5 * * *"
    # Nine hourly two-picture match posts, 08:00–16:00 SAST (UTC+2).
    - cron: "0 6-14 * * *"
    # One +50-minute backup per SAME slot, not nine additional posts.
    - cron: "50 6-14 * * *"
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  content:
    uses: ./.github/workflows/facebook-feed-run.yml
    with:
      kind: editorial
      publish: ${{ github.event_name == 'schedule' || inputs.publish }}
      preview: false
      bootstrap: false
    secrets: inherit
