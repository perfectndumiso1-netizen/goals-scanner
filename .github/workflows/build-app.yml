name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-app.yml"
      - ".github/workflows/actions.lock"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/build-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-app-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.4.0
      - name: Set up JDK 17
        uses: actions/setup-java@v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3.5.0
        with:
          gradle-version: "8.11.1"
      - name: Compile Android resources and run native security tests (no release secrets)
        run: |
          cd android
          gradle --no-daemon assembleDebug testDebugUnitTest
  apk:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: "1.6.85"
      APP_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3.5.0
        with:
          gradle-version: "8.11.1"   # required by AGP 8.9.1

      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KS_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required Android release-signing secret is missing: $name"
              exit 1
            fi
          done
          install -m 600 /dev/null "$RUNNER_TEMP/keystore.p12"
          printf '%s' "$KS_B64" | base64 --decode > "$RUNNER_TEMP/keystore.p12"
          keytool -list -keystore "$RUNNER_TEMP/keystore.p12" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "KEYSTORE_PATH=$RUNNER_TEMP/keystore.p12" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          gradle --no-daemon assembleRelease
          ls -la app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Mr2Odds.apk"

      - name: Verify installable package and release-key continuity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Surface exact failed checks as annotations (visible from a phone, without downloading job logs).
          check() {
            local label="$1"; shift
            if "$@" > "$RUNNER_TEMP/apk-check.log" 2>&1; then
              cat "$RUNNER_TEMP/apk-check.log"
              echo "::notice::APK check passed: $label"
            else
              echo "::error::APK check failed: $label"
              while IFS= read -r line; do
                line="${line//'%'/'%25'}"
                echo "::error::$line"
              done < <(tail -n 12 "$RUNNER_TEMP/apk-check.log")
              return 1
            fi
          }
          TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APK="$RUNNER_TEMP/Mr2Odds.apk"
          check archive unzip -t "$APK"
          check alignment "$TOOLS/zipalign" -c -P 16 -v 4 "$APK"
          check signature "$TOOLS/apksigner" verify --verbose --print-certs --min-sdk-version 26 "$APK"
          cp "$RUNNER_TEMP/apk-check.log" "$RUNNER_TEMP/signature.txt"
          check package "$TOOLS/aapt" dump badging "$APK"
          cp "$RUNNER_TEMP/apk-check.log" "$RUNNER_TEMP/package.txt"
          check application-id grep "package: name='com.playreport.app'" "$RUNNER_TEMP/package.txt"
          check version-name grep "versionName='${APP_VERSION_NAME}'" "$RUNNER_TEMP/package.txt"
          mkdir -p "$RUNNER_TEMP/previous-apk"
          check previous-release gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName
          PREVIOUS=$(head -1 "$RUNNER_TEMP/apk-check.log")
          check previous-download gh release download "$PREVIOUS" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir "$RUNNER_TEMP/previous-apk"
          OLD=$(find "$RUNNER_TEMP/previous-apk" -name '*.apk' -print -quit)
          check previous-signature "$TOOLS/apksigner" verify --print-certs "$OLD"
          cp "$RUNNER_TEMP/apk-check.log" "$RUNNER_TEMP/previous-signature.txt"
          check signing-key-continuity diff <(sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/previous-signature.txt" | sort -u) <(sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/signature.txt" | sort -u)
          check previous-package "$TOOLS/aapt" dump badging "$OLD"
          OLD_CODE=$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" "$RUNNER_TEMP/apk-check.log" | head -1)
          check increasing-version-code test "$APP_VERSION_CODE" -gt "$OLD_CODE"
          cp "$OLD" "$RUNNER_TEMP/previous.apk"
          (cd "$RUNNER_TEMP"; cp Mr2Odds.apk "Mr2Odds-${APP_VERSION_NAME}.apk"; sha256sum "Mr2Odds-${APP_VERSION_NAME}.apk" > Mr2Odds.apk.sha256)

      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android install and in-place upgrade smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            adb install "$RUNNER_TEMP/previous.apk"
            adb install -r "$RUNNER_TEMP/Mr2Odds.apk"
            adb shell am start -W -n com.playreport.app/.MainActivity
            adb shell dumpsys package com.playreport.app | grep 'versionName=1.6.85'

      - name: Unit tests (host allowlist, update digest)
        run: |
          cd android
          gradle --no-daemon testDebugUnitTest

      - name: Upload build artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: Mr2Odds-apk
          path: ${{ runner.temp }}/Mr2Odds.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="app-v${APP_VERSION_NAME}"
          # release notes = android/RELEASE_NOTES.md (shown inside the app before and after updating)
          { cat android/RELEASE_NOTES.md; printf '\n\nMr 2 Odds for Android v%s (build %s). Android verifies the signature and asks you to confirm the install.\n' "$APP_VERSION_NAME" "$APP_VERSION_CODE"; } > "$RUNNER_TEMP/notes.md"
          cp "$RUNNER_TEMP/Mr2Odds.apk" "$RUNNER_TEMP/Mr2Odds-${APP_VERSION_NAME}.apk"
          gh release create "$TAG" "$RUNNER_TEMP/Mr2Odds-${APP_VERSION_NAME}.apk" "$RUNNER_TEMP/Mr2Odds.apk.sha256" --repo "$GITHUB_REPOSITORY" --title "Mr 2 Odds v${APP_VERSION_NAME}" --notes-file "$RUNNER_TEMP/notes.md" --latest
