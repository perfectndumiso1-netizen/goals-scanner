name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-app.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-app
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 1.1.${{ github.run_number }}
      APP_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/keystore.p12"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/keystore.p12" >> "$GITHUB_ENV"
          else
            echo "No keystore secret - the APK will be debug-signed"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          gradle --no-daemon assembleRelease
          ls -la app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/PlayReport.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayReport-apk
          path: ${{ runner.temp }}/PlayReport.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="app-v${APP_VERSION_NAME}"
          NOTES="PlayReport for Android v${APP_VERSION_NAME} (build ${APP_VERSION_CODE}). Download PlayReport.apk and install it. Installed apps update themselves automatically."
          gh release create "$TAG" "$RUNNER_TEMP/PlayReport.apk" --repo "$GITHUB_REPOSITORY" --title "PlayReport v${APP_VERSION_NAME}" --notes "$NOTES" --latest
