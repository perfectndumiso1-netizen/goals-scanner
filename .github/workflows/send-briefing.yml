# One-shot: push branch `briefing-send` with tmp/briefing.mp4.
# Sends the video to Telegram, then the operator deletes the branch so the file is not kept.
name: Send briefing to Telegram
on:
  push:
    branches: [briefing-send]
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Send video then forget the file
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os, sys, pathlib, urllib.request, json
          token, chat = os.getenv("TELEGRAM_BOT_TOKEN"), os.getenv("TELEGRAM_CHAT_ID")
          path = pathlib.Path("tmp/briefing.mp4")
          if not token or not chat:
              print("Telegram secrets missing"); sys.exit(1)
          if not path.exists():
              print("no tmp/briefing.mp4"); sys.exit(1)
          boundary = "----PlayReportBriefing"
          caption = "PlayReport shortlist reel — no music, one voice-over per pick. A shortlist for your review, not an instruction to bet. 18+"
          data = path.read_bytes()
          parts = []
          def field(name, value):
              parts.append(f"--{boundary}\r\nContent-Disposition: form-data; name=\"{name}\"\r\n\r\n{value}\r\n".encode())
          field("chat_id", chat)
          field("caption", caption)
          field("supports_streaming", "true")
          parts.append(
              f"--{boundary}\r\nContent-Disposition: form-data; name=\"video\"; filename=\"PlayReport-shortlist.mp4\"\r\nContent-Type: video/mp4\r\n\r\n".encode()
              + data + b"\r\n" + f"--{boundary}--\r\n".encode()
          )
          body = b"".join(parts)
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendVideo",
              data=body,
              method="POST",
              headers={"Content-Type": f"multipart/form-data; boundary={boundary}"},
          )
          try:
              with urllib.request.urlopen(req, timeout=120) as r:
                  j = json.loads(r.read().decode())
          except Exception as e:
              print("send failed", e)
              sys.exit(1)
          if not j.get("ok"):
              print("telegram", j)
              sys.exit(1)
          print("sent", j.get("result", {}).get("message_id"))
          path.unlink(missing_ok=True)
          PY
