# One-shot: push branch `briefing-send` with tmp/briefing.mp4.
# Sends the video to Telegram, then the operator deletes the branch so the file is not kept.
name: Send briefing to Telegram
on:
  push:
    branches: [briefing-send]
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.4.0
      - name: Send video then forget the file
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os, sys, pathlib, urllib.request, json
          token, chat = os.getenv("TELEGRAM_BOT_TOKEN"), os.getenv("TELEGRAM_CHAT_ID")
          path_16x9 = pathlib.Path("tmp/briefing.mp4")
          path_9x16 = pathlib.Path("tmp/briefing-reel.mp4")
          tv_16x9 = pathlib.Path("tmp/tv-analysis-16x9.mp4")
          tv_9x16 = pathlib.Path("tmp/tv-analysis-9x16.mp4")
          if not token or not chat:
              print("Telegram secrets missing"); sys.exit(1)
          if not any(p.exists() for p in (path_16x9, path_9x16, tv_16x9, tv_9x16)):
              print("no video files found in tmp/"); sys.exit(1)
          cap_file = pathlib.Path("tmp/briefing_caption.txt")
          base_caption = (
              cap_file.read_text(encoding="utf-8").strip()
              if cap_file.exists()
              else "🎬 PlayReport shortlist — A shortlist for your review, not an instruction to bet. 18+."
          )
          tv_cap_file = pathlib.Path("tmp/tv_caption.txt")
          tv_caption = (
              tv_cap_file.read_text(encoding="utf-8").strip()
              if tv_cap_file.exists()
              else "📺 PlayReport Matchday Deep Dive (TV Analysis) — Statistical breakdown, not betting advice. 18+."
          )
          def send_one(vpath, fname, cap, w, h):
              boundary = "----PlayReportBriefing"
              data = vpath.read_bytes()
              parts = []
              def field(name, value):
                  parts.append(f"--{boundary}\r\nContent-Disposition: form-data; name=\"{name}\"\r\n\r\n{value}\r\n".encode())
              field("chat_id", chat)
              field("caption", cap)
              field("width", str(w))
              field("height", str(h))
              field("supports_streaming", "true")
              parts.append(
                  f"--{boundary}\r\nContent-Disposition: form-data; name=\"video\"; filename=\"{fname}\"\r\nContent-Type: video/mp4\r\n\r\n".encode()
                  + data + b"\r\n" + f"--{boundary}--\r\n".encode()
              )
              body = b"".join(parts)
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendVideo",
                  data=body,
                  method="POST",
                  headers={"Content-Type": f"multipart/form-data; boundary={boundary}"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      j = json.loads(r.read().decode())
              except Exception as e:
                  print("send failed", e)
                  sys.exit(1)
              if not j.get("ok"):
                  print("telegram", j)
                  sys.exit(1)
              print("sent", fname, j.get("result", {}).get("message_id"))
              vpath.unlink(missing_ok=True)
          if path_16x9.exists():
              send_one(path_16x9, "PlayReport-shortlist-16x9.mp4", base_caption, 1920, 1080)
          if path_9x16.exists():
              reel_cap = base_caption.replace("16:9", "9:16 reel").replace("🎬", "📱")
              send_one(path_9x16, "PlayReport-shortlist-9x16-reel.mp4", reel_cap, 1080, 1920)
          if tv_16x9.exists():
              send_one(tv_16x9, "PlayReport-tv-analysis-16x9.mp4", tv_caption, 1920, 1080)
          if tv_9x16.exists():
              tv_reel_cap = tv_caption.replace("16:9", "9:16 TikTok").replace("📺", "📱")
              send_one(tv_9x16, "PlayReport-tv-analysis-9x16-tiktok.mp4", tv_reel_cap, 1080, 1920)
          PY
