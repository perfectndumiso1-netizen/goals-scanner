# One-shot: push branch `briefing-send` with the video files under tmp/.
# Sends them to Telegram, then the operator deletes the branch so the files are not kept.
name: Send briefing to Telegram
on:
  push:
    branches: [briefing-send]
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4.4.0
      - name: Send videos then forget the files
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          VIDEO_RECOVERY_DIR: ${{ github.workspace }}/tmp/video-recovery
        run: |
          python3 - <<'PY'
          import os, sys, pathlib, urllib.request, urllib.parse, json
          from facebook_post import publish
          facebook_failures = []
          token, chat = os.getenv("TELEGRAM_BOT_TOKEN"), os.getenv("TELEGRAM_CHAT_ID")
          path_16x9 = pathlib.Path("tmp/briefing.mp4")
          path_9x16 = pathlib.Path("tmp/briefing-reel.mp4")
          bd_16x9 = pathlib.Path("tmp/breakdown-16x9.mp4")
          bd_9x16 = pathlib.Path("tmp/breakdown-9x16.mp4")
          if not token or not chat:
              print("Telegram secrets missing"); sys.exit(1)
          if not any(p.exists() for p in (path_16x9, path_9x16, bd_16x9, bd_9x16)):
              print("no video files found in tmp/"); sys.exit(1)
          cap_file = pathlib.Path("tmp/briefing_caption.txt")
          base_caption = (
              cap_file.read_text(encoding="utf-8").strip()
              if cap_file.exists()
              else "🎬 PlayReport shortlist — A shortlist for your review, not an instruction to bet. 18+."
          )
          bd_cap_file = pathlib.Path("tmp/breakdown_caption.txt")
          bd_caption = (
              bd_cap_file.read_text(encoding="utf-8").strip()
              if bd_cap_file.exists()
              else "🎬 PlayReport match breakdowns (16:9) — Form, home and away splits, head to head, team news and picks. 18+."
          )
          credits_file = pathlib.Path("tmp/breakdown_credits.txt")
          def send_one(vpath, fname, cap, w, h):
              facebook = publish(vpath, cap)
              if facebook.status == "failed":
                  facebook_failures.append(vpath.name)
              boundary = "----PlayReportBriefing"
              data = vpath.read_bytes()
              parts = []
              def field(name, value):
                  parts.append(f"--{boundary}\r\nContent-Disposition: form-data; name=\"{name}\"\r\n\r\n{value}\r\n".encode())
              field("chat_id", chat)
              field("caption", cap[:1024])
              field("width", str(w))
              field("height", str(h))
              field("supports_streaming", "true")
              parts.append(
                  f"--{boundary}\r\nContent-Disposition: form-data; name=\"video\"; filename=\"{fname}\"\r\nContent-Type: video/mp4\r\n\r\n".encode()
                  + data + b"\r\n" + f"--{boundary}--\r\n".encode()
              )
              body = b"".join(parts)
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendVideo",
                  data=body,
                  method="POST",
                  headers={"Content-Type": f"multipart/form-data; boundary={boundary}"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=180) as r:
                      j = json.loads(r.read().decode())
              except Exception as e:
                  print("send failed", e)
                  sys.exit(1)
              if not j.get("ok"):
                  print("telegram", j)
                  sys.exit(1)
              print("sent", fname, j.get("result", {}).get("message_id"))
              if facebook.status != "failed":
                  vpath.unlink(missing_ok=True)
          def send_text(text):
              body = urllib.parse.urlencode({"chat_id": chat, "text": text[:4000], "disable_web_page_preview": "true"}).encode()
              req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=body, method="POST")
              with urllib.request.urlopen(req, timeout=60) as r:
                  j = json.loads(r.read().decode())
              print("sent credits message", j.get("ok"))
          if path_16x9.exists():
              send_one(path_16x9, "PlayReport-shortlist-16x9.mp4", base_caption, 1920, 1080)
          if path_9x16.exists():
              reel_cap = base_caption.replace("16:9", "9:16 reel").replace("🎬", "📱")
              send_one(path_9x16, "PlayReport-shortlist-9x16-reel.mp4", reel_cap, 1080, 1920)
          if bd_16x9.exists():
              send_one(bd_16x9, "PlayReport-match-breakdown-16x9.mp4", bd_caption, 1920, 1080)
          if bd_9x16.exists():
              bd_reel_cap = bd_caption.replace("16:9", "9:16 TikTok").replace("🎬", "📱")
              send_one(bd_9x16, "PlayReport-match-breakdown-9x16-tiktok.mp4", bd_reel_cap, 1080, 1920)
          if credits_file.exists():
              send_text(credits_file.read_text(encoding="utf-8").strip())
          if facebook_failures:
              print("Facebook publishing failed; video files retained and Telegram sends attempted:", ", ".join(facebook_failures))
              sys.exit(1)
          PY
      - name: Preserve unsent or Facebook-failed videos
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: video-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tmp/video-recovery/
            tmp/briefing*.mp4
            tmp/breakdown*.mp4
          if-no-files-found: ignore
          retention-days: 7
