name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --only-binary=:all: --retries 10 --timeout 60 -r requirements.txt
          pip install --only-binary=:all: --retries 10 --timeout 60 pytest

      - name: Run all Python tests
        run: python -m pytest leagues/tests tests tennis/tests -q
