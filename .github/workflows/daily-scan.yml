name: Goals scan (3x daily)

on:
  schedule:
    # GitHub cron is UTC. 05:00 / 10:00 / 15:00 UTC = 07:00 / 12:00 / 17:00 South African time (SAST, no DST).
    - cron: "0 5,10,15 * * *"
  workflow_dispatch:        # lets you run it manually from the Actions tab at any time

permissions:
  contents: write           # needed so the job can commit the reports back to the repo

concurrency:
  group: goals-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TIMEZONE: "Africa/Johannesburg"   # timezone for all displayed times and the scan window
      TZ_LABEL: "SAST"
      RUN_HOURS: "7,12,17"  # scheduled run hours (local); each run builds parlays for kick-offs before the next run
      WINDOW_HOURS: "24"    # scan matches kicking off within the next 24 hours
      MIN_P_O15: "0.84"     # shortlist thresholds (final probability)
      MIN_P_O25: "0.60"
      MIN_P_BTTS: "0.60"
      MAX_PICKS: "15"
      PARLAYS_PER_RUN: "3"
      PARLAY_MIN_ODDS: "2.70"
      PARLAY_MAX_ODDS: "3.50"
      SPORTY_CC: "za"       # Sportybet country site used for prices (za, ng, gh, ke, ug, tz, zm)
      # LEAGUES: "E0,SP1,I1,D1,F1"   # uncomment to restrict competitions
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}   # optional
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}       # optional
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        run: python scanner.py

      - name: Commit and push results
        run: |
          git config user.name "goals-scanner-bot"
          git config user.email "goals-scanner-bot@users.noreply.github.com"
          git add -A reports data README.md
          git reset -q -- reports/pdf || true
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
            exit 0
          fi
          git commit -m "Scan $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push
