name: Check Facebook post visibility (read only)
on:
  workflow_dispatch:
    inputs:
      post_suffix:
        description: Numeric suffix of the existing post (no token)
        type: string
        default: '122152496451000672'
        required: true
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - name: Read existing post only; never publish or modify it
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          POST_SUFFIX: ${{ inputs.post_suffix }}
        run: python -m scripts.check_facebook_visibility --post-suffix "$POST_SUFFIX"
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: facebook-visibility-${{ github.run_id }}
          path: tmp/facebook-visibility/report.json
          if-no-files-found: ignore
          retention-days: 7
