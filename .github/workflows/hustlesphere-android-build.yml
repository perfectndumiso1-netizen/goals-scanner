name: Build HustleSphere Android APK

on:
  push:
    paths:
      - "hustlesphere/**"
      - ".github/workflows/hustlesphere-android-build.yml"
      - ".github/workflows/actions.lock"
  pull_request:
    paths:
      - "hustlesphere/**"
      - ".github/workflows/hustlesphere-android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hustlesphere-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v3.5.0
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK and run unit tests
        working-directory: hustlesphere
        run: |
          gradle --no-daemon testDebugUnitTest assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: HustleSphere-debug-apk
          path: hustlesphere/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4.4.0

      - name: Install pinned Supabase CLI
        run: npm install --global supabase@2.122.0

      - name: Start local Supabase and apply migrations
        working-directory: hustlesphere
        run: |
          supabase start
          supabase db reset

      - name: Run multi-account RLS and messaging tests
        working-directory: hustlesphere
        run: supabase test db

  publish-debug-release:
    # Provide a direct, anonymous download for this session branch without touching the latest PlayReport release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/arena/a2cb6a9a-goals-scanner'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download the built APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name HustleSphere-debug-apk \
            --dir ./release
          test -s ./release/app-debug.apk

      - name: Publish a public debug prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="hustlesphere-debug-${GITHUB_SHA::7}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "./release/app-debug.apk#HustleSphere-debug.apk" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "./release/app-debug.apk#HustleSphere-debug.apk" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "HustleSphere debug APK (${GITHUB_SHA::7})" \
              --notes "Debug build for evaluation only. It is not production-signed or preconfigured with Supabase. Configure the Supabase URL and anon/publishable client key before use. No service-role key is included." \
              --prerelease
          fi
