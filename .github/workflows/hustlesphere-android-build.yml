name: Build HustleSphere Android APK

on:
  push:
    paths:
      - "hustlesphere/**"
      - ".github/workflows/hustlesphere-android-build.yml"
      - ".github/workflows/actions.lock"
  pull_request:
    paths:
      - "hustlesphere/**"
      - ".github/workflows/hustlesphere-android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hustlesphere-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v3.5.0
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK and run unit tests
        working-directory: hustlesphere
        run: |
          gradle --no-daemon testDebugUnitTest assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: HustleSphere-debug-apk
          path: hustlesphere/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
