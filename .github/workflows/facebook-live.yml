name: Facebook meaningful live events (08:00–24:00 SAST)
on:
  workflow_dispatch:
    inputs:
      diagnostic:
        description: Read-only API/key diagnostics (never publishes)
        type: boolean
        default: false
      publish:
        type: boolean
        default: false
      preview:
        type: boolean
        default: true
      bootstrap:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  content:
    if: ${{ inputs.diagnostic }}
    uses: ./.github/workflows/facebook-feed-run.yml
    with:
      kind: live
      diagnostic: ${{ inputs.diagnostic || false }}
      publish: ${{ github.event_name == 'schedule' || inputs.publish }}
      preview: ${{ github.event_name == 'workflow_dispatch' && inputs.preview }}
      bootstrap: ${{ inputs.bootstrap || false }}
    secrets: inherit
