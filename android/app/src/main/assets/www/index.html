<header id="top">
  <div class="logo" aria-hidden="true"><img src="logo.png" alt="" width="34" height="34"></div>
  <div class="brand">
    <div class="title">PlayReport</div>
  </div>
  <button class="icon-btn" id="btn-search" title="Search matches" aria-label="Search matches"><svg class="ic"><use href="#i-search"/></svg></button>
  <button class="icon-btn" id="btn-refresh" title="Refresh" aria-label="Refresh"><svg class="ic"><use href="#i-refresh"/></svg></button>
  <button class="icon-btn" id="btn-menu" title="Menu" aria-label="Menu"><svg class="ic"><use href="#i-more"/></svg></button>
  <div id="menu" class="menu">
    <button data-page="best"><svg class="ic"><use href="#i-sparkle"/></svg>Best of the day</button>
    <button data-page="tickets"><svg class="ic"><use href="#i-ticket"/></svg>My tickets</button>
    <button data-page="guide"><svg class="ic"><use href="#i-info"/></svg>Guide to the markets</button>
    <button data-page="performance"><svg class="ic"><use href="#i-chart"/></svg>Performance</button>
    <button data-page="analysis"><svg class="ic"><use href="#i-doc"/></svg>Full analysis (report)</button>
    <button data-csv="1"><svg class="ic"><use href="#i-download"/></svg>Download today's data (CSV)</button>
    <button data-page="tennis">🎾 Tennis (separate section)</button>
    <button data-page="settings"><svg class="ic"><use href="#i-settings"/></svg>Settings</button>
    <button data-contact="1"><svg class="ic"><use href="#i-chat"/></svg>Contact on WhatsApp</button>
  </div>
</header>

<main id="view"></main>

<nav id="tabs">
  <button data-tab="home" class="active"><span class="ic-wrap"><svg class="ic"><use href="#i-home"/></svg></span>Home</button>
  <button data-tab="bets"><span class="ic-wrap"><svg class="ic"><use href="#i-target"/></svg></span>Bets</button>
  <button data-tab="live"><span class="ic-wrap"><svg class="ic"><use href="#i-live"/></svg><span class="dot" id="live-dot"></span></span>Live</button>
  <button data-tab="matches"><span class="ic-wrap"><svg class="ic"><use href="#i-calendar"/></svg></span>Matches</button>
  <button data-tab="days"><span class="ic-wrap"><svg class="ic"><use href="#i-history"/></svg></span>Days</button>
  <button data-tab="leagues"><span class="ic-wrap"><svg class="ic"><use href="#i-trophy"/></svg></span>Leagues</button>
</nav>

<div id="slipbar"></div>
<div id="modal" class="modal" hidden><div class="modal-box"><div class="modal-title" id="modal-title"></div><div class="modal-text" id="modal-text"></div><div class="row" style="gap:8px;margin-top:14px;justify-content:flex-end"><button class="btn" id="modal-cancel">Cancel</button><button class="btn primary" id="modal-ok">OK</button></div></div></div>
<div id="toast"></div>

<script src="core.js"></script>
<script src="views.js"></script>

<script src="pages.js"></script>
